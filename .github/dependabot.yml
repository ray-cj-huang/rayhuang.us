version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    groups:
      react-three:
        patterns: ["three", "@types/three", "@react-three/*"]
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
